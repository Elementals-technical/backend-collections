        children:
          - url: "{{_['render-admin-domain']}}/configurators"
            name: create configurator
            meta:
              id: req_3e3df03629994e2397145d2077418511
              created: 1768809260144
              modified: 1768810387131
              isPrivate: false
              description: ""
              sortKey: -1768809263189
            method: POST
            body:
              mimeType: application/json
              text: |-
                {
                  "name": "VR Badroom Configurator",
                  "organizationId": 1,
                  "enabled": false,
                  "description": "VR configurator for badroom products"
                }
            headers:
              - name: Authorization
                value: Bearer {{_['render-admin-token']}}
              - name: Content-Type
                value: application/json
            authentication:
              type: bearer
              disabled: false
              token: "{{_['render-admin-token']}}"
              prefix: ""
            scripts:
              preRequest: >
                const loginEndpoint =
                insomnia.variables.get("render-admin-domain") + "/login";

                const username =
                insomnia.variables.get("render-admin-username");

                const password =
                insomnia.variables.get("render-admin-password");


                const loginRequest = {
                  method: "POST",
                  url: loginEndpoint,
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    username,
                    password
                  })
                };


                insomnia.sendRequest(loginRequest, function (err, response) {
                  if (err) {
                    console.log("Error while logging in:", err);
                    return;
                  }

                  try {
                    const json = JSON.parse(response.body);
                    const token = json.token;

                    if (!token) {
                      console.log("No token found in login response");
                      return;
                    }

                    insomnia.environment.set("render-admin-token", token);
                    console.log("Login successful, token saved");
                  } catch (e) {
                    console.log("Failed to parse login response:", e);
                  }
                });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
