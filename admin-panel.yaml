        children:
          - url: "{{render_admin_domain}}/static-auth-tokens"
            name: create token
            meta:
              id: req_760cd4b7b8734fe0821cc70b74851c76
              created: 1764496106027
              modified: 1764510096991
              isPrivate: false
              description: ""
              sortKey: -1764496102610
            method: POST
            body:
              mimeType: application/json
              text: |-
                {
                    "name": "test_plo"
                }
            headers:
              - name: Authorization
                value: Bearer {{render_admin_token}}
              - name: Content-Type
                value: application/json
            authentication:
              type: bearer
              disabled: false
              token: "{{render_admin_token}}"
              prefix: ""
            scripts:
              preRequest: >
                const loginEndpoint =
                insomnia.variables.get("render_admin_domain") + "/login";

                const username =
                insomnia.variables.get("render_admin_username");

                const password =
                insomnia.variables.get("render_admin_password");


                const loginRequest = {
                  method: "POST",
                  url: loginEndpoint,
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    username,
                    password
                  })
                };


                insomnia.sendRequest(loginRequest, function (err, response) {
                  if (err) {
                    console.log("Error while logging in:", err);
                    return;
                  }

                  try {
                    const json = JSON.parse(response.body);
                    const token = json.token;

                    if (!token) {
                      console.log("No token found in login response");
                      return;
                    }

                    insomnia.environment.set("render_admin_token", token);
                    console.log("Login successful, token saved");
                  } catch (e) {
                    console.log("Failed to parse login response:", e);
                  }
                });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
